project_name: Bobby Studio
description: Image studio using prompt, sketch and reference images; video is deferred.
baseline_commit: 82958dc
documented_at: '2026-10-05'
documentation_status: architecture_planned_not_implemented
instructions: ../AGENTS.md
documents:
  architecture: ../docs/architecture/overview.md
  current_source_audit: ../docs/architecture/source-audit.md
  contracts: ../docs/architecture/generation-contracts.md
  ui_design: ../docs/product/studio-design.md
  agent_plan: ../docs/delivery/agent-plan.md
  verification: ../docs/delivery/verification.md
  cleanup: ../docs/delivery/cleanup-plan.md
  autonomous_execution: ../docs/delivery/autonomous-execution.md
current_stack:
  frontend: React 18 + TypeScript + Vite + Chakra UI 2
  routing: React Router 6
  server_state: TanStack Query 5 plus legacy Redux flows
  editor_state: React hooks; existing Redux and Zustand stores
  auth: Firebase; legacy custom bypass is scheduled for replacement with official emulator support
  api: NestJS 10 with some integration package majors requiring compatibility checks
  jobs: BullMQ 5 + Redis + separate NestJS worker
  database: PostgreSQL + Prisma, with duplicate Sequelize model catalog paths
  rendering: External Python adapter currently wired; Sharp for post-processing
current_entrypoints:
  studio: src/features/generation/components/StudioEditor.tsx
  generation_feature: src/features/generation
  realtime_scheduler: src/features/generation/scheduler/scheduler.ts
  generation_hook: src/features/generation/hooks/useRealtimeGeneration.ts
  socket_hook: src/hooks/useJobSocket.ts
  api_client: src/services/api/client.ts
  theme: src/theme/index.ts
target_invariants:
  - New code comments, documentation and UI source copy use English.
  - Both OpenAI and Gemini adapters use matching HTTP simulator facades locally.
  - Provider keys stay server-side; live activation is configuration-only.
  - Use Firebase Auth Emulator for local verification; remove custom bypass identity.
  - Remove fake business data and synthetic CRUD success from shipped code.
  - Identity comes from the authenticated principal, never request body userId.
  - Realtime is optional and debounced; stale revisions cannot replace newer results.
  - PostgreSQL owns durable state; queue and socket messages may be delivered again.
  - Final result and credit capture are transactional and idempotent.
  - One retry owner; unknown provider outcomes are not blindly retried.
  - Preserve the existing stack and migrate one use case at a time.
  - Tests cover critical behavior, not one file for every class.
status:
  dependencies_installed_at_audit: false
  application_build_or_e2e_verified_at_audit: false
  ui_prototype: standalone_browser_design_only
