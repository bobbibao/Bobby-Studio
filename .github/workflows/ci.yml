name: ci

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      BOBBY_PG_ADMIN_URL: postgresql://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup (installs from lockfiles, generates ignored env files, migrates, seeds)
        run: node scripts/setup.mjs
      - name: API typecheck and non-mutating lint
        working-directory: server-api
        run: |
          yarn typecheck
          yarn lint:check
      - name: Worker typecheck and non-mutating lint
        working-directory: worker
        run: |
          yarn typecheck
          yarn lint:check
      - name: Unit tests
        run: |
          yarn --cwd server-api test
          yarn --cwd worker test
          yarn --cwd image-simulator test
      - name: API integration tests (real PostgreSQL and Redis)
        run: |
          (cd tools && yarn install --frozen-lockfile)
          node scripts/dev.mjs start --only=auth-emulator
          yarn --cwd server-api test:integration
      - name: Frontend typecheck, lint, tests and build
        working-directory: frontend
        run: |
          yarn type-check
          yarn lint
          yarn test
          yarn build
      - name: Stack end-to-end (API, worker, simulator, browser)
        run: |
          node scripts/dev.mjs start --build
          (cd tools && node_modules/.bin/playwright install --with-deps chromium && node_modules/.bin/playwright test)
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tools/test-results
            .data/logs
          retention-days: 7

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build images (no push)
        run: |
          docker build -t bobby-api:ci server-api
          docker build -t bobby-worker:ci worker
          docker build -t bobby-simulator:ci image-simulator
          docker build -t bobby-web:ci frontend
